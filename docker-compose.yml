services:
  mealmcp:
    # Image publiée par le CI. Pour figer une version : MEALMCP_VERSION=0.1.0 dans .env.
    image: ghcr.io/rem7474/mealmcp:${MEALMCP_VERSION:-latest}
    # Pour construire localement plutôt que télécharger : docker compose up -d --build
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Valeurs lues dans un fichier .env à côté de ce fichier (voir .env.example).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TZ: Europe/Paris
    volumes:
      - mealmcp-data:/data

volumes:
  mealmcp-data:
