services:
  mealmcp:
    # Image published by the CI. To pin a version: MEALMCP_VERSION=0.1.0 in .env.
    image: ghcr.io/rem7474/mealmcp:${MEALMCP_VERSION:-latest}
    # To build locally instead of pulling: docker compose up -d --build
    build: .
    restart: unless-stopped
    ports:
      # PORT (from .env) is the port published on the host; inside the container the app stays on 3000.
      - "${PORT:-3000}:3000"
    environment:
      # Values come from a .env file next to this one (see .env.example).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-3000}}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Time zone used for "today" in the meal plan and expiry dates (e.g. TZ=Europe/Paris in .env).
      TZ: ${TZ:-UTC}
    volumes:
      - mealmcp-data:/data

volumes:
  mealmcp-data:
