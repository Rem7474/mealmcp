services:
  mealmcp:
    # Image published by the CI. To pin a version: MEALMCP_VERSION=0.1.0 in .env.
    image: ghcr.io/rem7474/mealmcp:${MEALMCP_VERSION:-latest}
    # To build locally instead of pulling: docker compose up -d --build
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # PORT (from .env) is the port published on the host; inside the container the app stays on 3000.
      - "${PORT:-3000}:3000"
    environment:
      # Values come from a .env file next to this one (see .env.example).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-3000}}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional local AI server, see .env.example. Empty means no AI features.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      LLM_VISION: ${LLM_VISION:-auto}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-2}
      # Time zone used for "today" in the meal plan and expiry dates (e.g. TZ=Europe/Paris in .env).
      TZ: ${TZ:-UTC}
    volumes:
      - mealmcp-data:/data

volumes:
  mealmcp-data:
