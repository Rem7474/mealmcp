sonar.projectKey=Rem7474_mealmcp
sonar.organization=rem7474

sonar.sources=server/src,web/src,scripts,docs/assets
sonar.tests=server/src,web/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,docs/screens/**,server/drizzle/**

# The English and French message files (and the generated docs pages) have the same keys on purpose:
# the duplication detector reads them as copy-paste.
sonar.cpd.exclusions=web/src/i18n/*.ts,scripts/build-docs.mjs,docs/**/*.html

sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,web/coverage/lcov.info
