name: Publish image

# Publishes the Docker image to GitHub Container Registry:
#   - every push to main  -> :main and :sha-<commit>
#   - every tag vX.Y.Z    -> :X.Y.Z, :X.Y, :latest
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install (lifecycle scripts off; only the native SQLite binding is built)
        run: npm ci --ignore-scripts && npm rebuild better-sqlite3
      - run: npm run build
      - run: npm test

  publish:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          # amd64 for servers and desktops, arm64 for Raspberry Pi / ARM NAS.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    # Only for version tags, and only once the image is published.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          cat > notes.md <<EOF
          ## Docker

          \`\`\`bash
          docker pull ${IMAGE,,}:${VERSION}
          \`\`\`

          Multi-arch image (amd64, arm64). See the README for configuration (\`PUBLIC_URL\`, accounts, MCP connection).

          ## Changes
          EOF
          # Pre-release for 0.x or tags with a suffix such as v1.0.0-rc.1.
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --generate-notes --notes-file notes.md $FLAGS
