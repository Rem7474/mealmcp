name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/_checks.yml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: mealmcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name mealmcp -p 3000:3000 -e LOG_FORMAT=json mealmcp:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:3000/health && break
            sleep 1
          done
          # The image's own health check agrees.
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mealmcp)" = healthy ] && break
            sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' mealmcp)" = healthy
          # Nothing is reachable without an account.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/stock)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/mcp -H 'Content-Type: application/json' -d '{}')" = 401
          curl -s -D - -o /dev/null -X POST http://localhost:3000/mcp | grep -i 'www-authenticate: .*resource_metadata'
          # API answers are never stored by browsers or the service worker.
          curl -s -D - -o /dev/null http://localhost:3000/api/stock | grep -i 'cache-control: .*no-store'
          # OAuth discovery for MCP clients.
          curl -fs http://localhost:3000/.well-known/oauth-authorization-server | grep -q '"registration_endpoint"'
          # First account, then an authenticated call.
          test "$(curl -s -c jar -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/register -H 'Content-Type: application/json' -d '{"email":"ci@example.test","name":"CI","password":"ci-password-long-enough"}')" = 201
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' http://localhost:3000/api/stock)" = 200
          # Logs are one JSON object per line and never hold the password.
          docker logs mealmcp 2>&1 | head -n 5 | while read -r line; do echo "$line" | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"; done
          ! docker logs mealmcp 2>&1 | grep -q 'ci-password-long-enough'
          # SIGTERM stops the app cleanly (exit code 0, not 137).
          docker stop -t 15 mealmcp
          test "$(docker inspect -f '{{.State.ExitCode}}' mealmcp)" = 0
      - name: Scan the image (high and critical, fixes available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mealmcp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Container logs
        if: failure()
        run: docker logs mealmcp
