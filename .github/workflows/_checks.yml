name: Checks

# Reusable: the same quality gate for pull requests (ci.yml) and for releases (release.yml).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install (lifecycle scripts off; only the native SQLite binding is built)
        run: npm ci --ignore-scripts && npm rebuild better-sqlite3
      - name: Lint and format
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - name: Keep coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            server/coverage/lcov.info
            web/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      # Only what ships in the image: a vulnerable dev tool does not reach production.
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
